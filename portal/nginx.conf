server {
    listen 80;
    server_name localhost;

    # 1. Serve the EY App Shell
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # 2. Route to Streamlit App
    location /studio/ {
        proxy_pass http://evals-ui:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /_stcore/ {
        proxy_pass http://evals-ui:8501/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 3. Route to Langfuse Dashboard & Apply Deep White-Labeling
    location /observability/ {
        proxy_pass http://langfuse:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Accept-Encoding "";
        
        # --- THE DEEP WHITE-LABEL INJECTOR ---
        sub_filter '</head>' '<style>
            /* Hide GitHub and Release links */
            a[href*="github.com/langfuse"] { display: none !important; }
            a[href*="releases"] { display: none !important; }
        </style>
        <script>
            // This runs continuously to catch React dynamic loading
            setInterval(function() {
                // 1. Replace the word "Langfuse" anywhere in the text
                var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
                var n;
                while(n = walk.nextNode()) {
                    if(n.nodeValue.includes("Langfuse")) {
                        n.nodeValue = n.nodeValue.replace(/Langfuse/g, "EY Observability");
                    }
                }
                
                // 2. Destroy the "New version available" / Update box
                var divs = document.getElementsByTagName("div");
                for(var i=0; i<divs.length; i++) {
                    if(divs[i].innerText && divs[i].innerText.includes("New version available")) {
                        divs[i].style.display = "none";
                    }
                }
            }, 500); // Checks twice a second
        </script></head>';
        
        sub_filter '<title>Langfuse</title>' '<title>EY Observability</title>';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    # Internal APIs
    location /api/ { proxy_pass http://langfuse:3000/api/; }
    location /_next/ { proxy_pass http://langfuse:3000/_next/; }
    location /trpc/ { proxy_pass http://langfuse:3000/trpc/; }
}